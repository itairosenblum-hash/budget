<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d5126">
<link rel="icon" href="../icon-192.png">
<title>מדריך תקציב אחזקה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: olive band like the app's header, then a "player": phone screen beside a caption + step list (stacked on phones). */
:root{
  --olive:#3d5126; --olive-2:#4f6a31; --amber:#e3a524; --amber-ink:#8a5a00;
  --bg:#f3f2ea; --surface:#fbfaf5; --line:#dedcca; --fg:#20251a; --muted:#666b5a;
  --band-fg:#f4f6ec; --chip:#e7e8d8; --dim:rgba(20,26,12,.42);
  --sans:"Heebo","Arial Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --olive:#2c3b1b; --olive-2:#4f6a31; --amber:#f0b53c; --amber-ink:#f5c766;
  --bg:#14180f; --surface:#1d2316; --line:#333c27; --fg:#eceee2; --muted:#a3a893;
  --band-fg:#eef1e4; --chip:#2a3220; --dim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --olive:#2c3b1b; --olive-2:#4f6a31; --amber:#f0b53c; --amber-ink:#f5c766;
  --bg:#14180f; --surface:#1d2316; --line:#333c27; --fg:#eceee2; --muted:#a3a893;
  --band-fg:#eef1e4; --chip:#2a3220; --dim:rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--olive)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--olive);color:var(--band-fg)}
header .wrap{padding-block:28px 22px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.1)}
h1{font-size:clamp(24px,4.4vw,34px);font-weight:900;margin:0;line-height:1.15;text-wrap:balance}
.lede a.back{color:inherit;font-weight:700}
.lede{margin:2px 0 0;opacity:.85;font-size:15px}
.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chapters button{font:inherit;font-weight:700;font-size:15px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--band-fg);
  border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25}
.chapters button small{font-weight:500;opacity:.75;font-size:12px}
.chapters button[aria-selected="true"]{background:var(--band-fg);color:#2c3b1b;border-color:transparent}
.chapters button:focus-visible,.ctl:focus-visible,.steps button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

main .wrap{padding-block:26px 40px}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:start}
.phone-col{display:flex;flex-direction:column;gap:12px;align-items:center}
.segs{display:flex;gap:4px;width:var(--pw)}
.phone-col{--pw:min(340px,82vw,calc((100vh - 110px)/2.164))}
.seg{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--olive-2)}
.seg.done i{width:100%}
.phone{width:var(--pw);aspect-ratio:390/844;max-width:100%;border-radius:38px;padding:9px;background:#111;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.45),inset 0 0 0 2px #2b2b2b;position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#000}
.cam{position:absolute;top:16px;left:50%;width:70px;height:20px;margin-left:-35px;background:#111;border-radius:12px;z-index:5}
.shot{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 5.5s ease-out}
.shot img{width:100%;height:100%;display:block}
.shot.in{animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spot{position:absolute;border:3px solid var(--amber);border-radius:12px;box-shadow:0 0 0 9999px var(--dim);pointer-events:none;
  animation:pulse 1.6s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{0%,100%{outline:0 solid rgba(227,165,36,.55)}50%{outline:8px solid rgba(227,165,36,0)}}
.tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.75);
  border:2px solid rgba(0,0,0,.35);opacity:0;pointer-events:none}
.tap.go{animation:tap 1.1s ease-out .9s 1 both}
@keyframes tap{0%{opacity:0;transform:scale(1.6)}35%{opacity:1;transform:scale(.8)}70%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}

.cap-col{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--amber-ink);display:flex;gap:8px;align-items:center}
.eyebrow b{background:var(--amber);color:#2a1e00;border-radius:999px;padding:1px 9px;font-size:12px}
.card h2{margin:0;font-size:clamp(21px,3vw,26px);font-weight:800;line-height:1.25;text-wrap:balance}
.card p{margin:0;font-size:17px;max-width:46ch}
.card .note{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;max-width:none}
.term{background:var(--chip);border-radius:6px;padding:0 6px;font-weight:700;white-space:nowrap}
.ctls{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.ctl{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:9px 16px;cursor:pointer}
.ctl.play{background:var(--olive-2);color:#fff;border-color:transparent;min-width:110px}
.ctl:disabled{opacity:.4;cursor:default}
.count{margin-inline-start:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps button{width:100%;text-align:start;font:inherit;font-size:15px;background:transparent;border:0;border-radius:10px;padding:8px 10px;
  color:var(--muted);cursor:pointer;display:flex;gap:10px;align-items:baseline}
.steps button::before{counter-increment:s;content:counter(s);font-weight:800;font-size:13px;min-width:22px;height:22px;border-radius:50%;
  display:inline-grid;place-items:center;background:var(--chip);color:var(--fg);flex:none;font-variant-numeric:tabular-nums}
.steps button[aria-current="step"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.steps button[aria-current="step"]::before{background:var(--amber);color:#2a1e00}
footer{color:var(--muted);font-size:13px;padding-block:0 30px}
@media (max-width:760px){
  .player{grid-template-columns:1fr;gap:20px}
  .phone-col{order:-1;--pw:min(340px,78vw,30vh)}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){
  .shot{transition:none!important;transform:none!important}
  .spot,.tap.go,.shot.in{animation:none}
}
</style>

<div dir="rtl" lang="he">
<header class="band">
  <div class="wrap">
    <div class="brand">
      <img src="../icon-192.png" alt="">
      <div>
        <h1>מדריך לאתר תקציב אחזקה</h1>
        <p class="lede">צעד אחר צעד, על המסכים האמיתיים של האתר · <a class="back" href="../">→ חזרה לאתר</a></p>
      </div>
    </div>
    <div class="chapters" role="tablist" aria-label="נושאים" id="chapters"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="player">
      <div class="cap-col">
        <div class="card" aria-live="polite">
          <div class="eyebrow" id="eyebrow"></div>
          <h2 id="title"></h2>
          <p id="body"></p>
          <p class="note" id="note" hidden></p>
          <div class="ctls">
            <button class="ctl" id="prev" type="button">→ הקודם</button>
            <button class="ctl play" id="play" type="button">⏸ השהיה</button>
            <button class="ctl" id="next" type="button">הבא ←</button>
            <span class="count" id="count"></span>
          </div>
        </div>
        <ol class="steps" id="steps"></ol>
      </div>
      <div class="phone-col">
        <div class="segs" id="segs"></div>
        <div class="phone"><div class="screen" id="screen"><div class="cam"></div></div></div>
      </div>
    </div>
  </div>
</main>
<footer><div class="wrap">המסכים צולמו מהאתר עם נתוני דוגמה (חברות, סכומים וחותמת לדוגמה בלבד).</div></footer>
</div>

<script>
const W = 390, H = 844;
const T = s => `<span class="term">${s}</span>`;
const CHAPTERS = [
  { id:"tour", name:"סיור באתר", sub:"מה יש איפה", scenes:[
    { img:"t1", box:[12,52,366,81], title:"שלוש לשוניות למעלה",
      body:`${T("חברות")}, ${T("תקציב")} ו־${T("1007")}. כל העבודה היומיומית נמצאת בהן. המספר הקטן ליד כל לשונית אומר כמה פריטים יש בה.` },
    { img:"t1b", box:[12,488,366,95], tap:true, title:"לשונית תקציב",
      body:`כרטיס לכל חברה. המספר הירוק הוא כמה כסף ${T("פנוי")}, ומתחתיו מתוך כמה. לוחצים על הכרטיס כדי לראות את הסעיפים שלה.` },
    { img:"t2", box:[12,232,366,199], title:"לשונית חברות",
      body:`כרטיס לכל ספק עם איש קשר ונייד. הכפתורים בצד: וואטסאפ, חיוג ומייל, בלחיצה אחת.` },
    { img:"t3", box:[12,201,366,55], title:"לשונית 1007: הזמנות עבודה",
      body:`${T("פתוחות")} הן הזמנות שעוד מחכות לחשבונית או לחתימה. ${T("טופלו")} הן הזמנות שנסגרו. בדרך כלל עובדים רק ב"פתוחות".` },
    { img:"t4", box:[12,766,66,66], tap:true, title:"כפתור ה־+ מוסיף",
      body:`הכפתור העגול מוסיף פריט חדש ללשונית שבה אתה נמצא: חברה, סעיף תקציב או 1007.` },
    { img:"t5", box:[12,628,366,106], title:"התפריט: סיכום ודוחות",
      body:`כפתור שלושת הקווים למעלה פותח סיכום של כל התקציב, ודוחות מוכנים ב־PDF וב־Excel.` },
  ]},
  { id:"search", name:"חיפוש סעיף ויתרה", sub:"כמה נשאר בסעיף", scenes:[
    { img:"s1", box:[12,131,366,56], title:"מחפשים את הסעיף",
      body:`בלשונית ${T("תקציב")} מקלידים בתיבת החיפוש מספר סעיף, שם חברה או מספר הזמנה.` },
    { img:"s2", box:[13,590,364,200], title:"היתרה כבר מופיעה",
      body:`בכרטיס הסעיף רואים מיד כמה ${T("פנוי")} ומתוך כמה. בפס: ירוק כהה זה מה שנוצל, צהוב מפוספס זה מה שמשוריין.` },
    { img:"s2b", box:[218,570,147,50], tap:true, title:"נכנסים לסעיף",
      body:`לוחצים על הסעיף, ואז על ${T("📋 כניסה לסעיף")} כדי לראות את כל הפרטים.` },
    { img:"s3", box:[14,240,362,196], title:"ראש הסעיף: כל המספרים",
      body:`${T("פנוי")} בגדול, ומתחת: ${T("נוצל בפועל")}, ${T("משוריין")}, מספר ההזמנה ותוקף ההזמנה.`,
      note:`משוריין = כסף ששמור ל־1007 פתוחות שעוד לא נסגרו. נוצל בפועל = חשבוניות שכבר נחתמו.` },
    { img:"s4", box:[10,612,370,232], title:"כל השורות של הסעיף",
      body:`למטה טבלה כמו בגיליון: שורה לכל 1007. סימן ${T("!")} כתום אומר שהשורה דורשת טיפול.` },
  ]},
  { id:"invoice", name:"חשבונית עד שליחה", sub:"העלאה, חתימה, שליחה", scenes:[
    { img:"i1", box:[213,537,152,48], tap:true, title:"מוצאים את ההזמנה",
      body:`בלשונית ${T("1007")} לוחצים על ההזמנה שהחשבונית שייכת לה, ואז ${T("🧾 העלאת חשבונית")}.` },
    { img:"i2", box:[12,166,366,114], tap:true, title:"מצרפים את החשבונית",
      body:`${T("📎 צירוף קובץ")}: מצלמים את החשבונית או בוחרים קובץ. אפשר גם ${T("📧 מ־Gmail")} אם היא הגיעה במייל.` },
    { img:"i3", box:[12,290,366,440], title:"האתר ממלא לבד",
      body:`החברה, ההזמנה, מספר החשבונית, התאריך והסכומים מתמלאים מהחשבונית. התפקיד שלך: לעבור ולבדוק שהכול נכון.`,
      note:`הקריאה האוטומטית עובדת כשמחוברים לאתר. אם משהו לא התמלא, מקלידים אותו ידנית.` },
    { img:"i4", box:[194,464,184,87], title:"חשבונית או תעודת משלוח?",
      body:`בודקים את ${T("סוג מסמך")}. רק ${T("חשבונית")} מורידה כסף מהתקציב. ${T("תעודת משלוח")} נשמרת לתיעוד ולא נספרת.` },
    { img:"i5", box:[12,731,366,89], title:"הסעיף כבר נבחר",
      body:`סעיף התקציב נבחר לפי ההזמנה. אם הכול נכון, לוחצים על ה־✓ הירוק למעלה כדי לשמור.` },
    { img:"i6", box:[194,179,184,60], tap:true, title:"באיזה תאריך לחתום?",
      body:`מסך החתימה נפתח לבד. בוחרים ${T("היום")} או ${T("אתמול")}, או מקלידים תאריך אחר.` },
    { img:"i7", box:[24,790,174,53], title:"ממקמים את החותמת",
      body:`גוררים את החותמת למקום ריק בחשבונית, או מקישים במקום הרצוי. אחר כך לוחצים ✓.` },
    { img:"i8", box:[12,393,366,372], tap:true, title:"שולחים לחברה",
      body:`בוחרים ${T("וואטסאפ")} או ${T("מייל")} לאיש הקשר של החברה. זהו: ההזמנה עוברת ל"טופלו" והסכום יורד מהתקציב.` },
  ]},
];

const $ = id => document.getElementById(id);
const DUR = 7000;
let ch = 0, sc = 0, playing = true, t0 = 0, elapsed = 0, raf = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function clampBox([x,y,w,h]){
  const x0 = Math.max(6,x), y0 = Math.max(6,y), x1 = Math.min(W-6,x+w), y1 = Math.min(H-6,y+h);
  return [x0,y0,x1-x0,y1-y0];
}
const pct = (v,base) => (v/base*100)+"%";

function buildChapters(){
  $("chapters").innerHTML = CHAPTERS.map((c,i)=>`<button role="tab" type="button" id="tab-${c.id}" data-ch="${i}" aria-selected="${i===ch}">${c.name}<small>${c.sub}</small></button>`).join("");
}
function render(fresh=true){
  const c = CHAPTERS[ch], s = c.scenes[sc];
  document.querySelectorAll("#chapters button").forEach((b,i)=>b.setAttribute("aria-selected", i===ch));
  $("eyebrow").innerHTML = `<b>${sc+1} / ${c.scenes.length}</b> ${c.name}`;
  $("title").textContent = s.title;
  $("body").innerHTML = s.body;
  $("note").hidden = !s.note; $("note").textContent = s.note || "";
  $("count").textContent = `נושא ${ch+1} מתוך ${CHAPTERS.length}`;
  $("prev").disabled = ch===0 && sc===0;
  $("next").disabled = ch===CHAPTERS.length-1 && sc===c.scenes.length-1;
  $("steps").innerHTML = c.scenes.map((x,i)=>`<li><button type="button" data-sc="${i}" ${i===sc?'aria-current="step"':""}>${x.title}</button></li>`).join("");
  $("segs").innerHTML = c.scenes.map((x,i)=>`<div class="seg ${i<sc?"done":""}"><i id="seg-${i}"></i></div>`).join("");

  // screen
  const [x,y,w,h] = clampBox(s.box);
  const old = $("screen").querySelector(".shot");
  const shot = document.createElement("div");
  shot.className = "shot in";
  shot.innerHTML = `<img src="${s.img}.jpg" alt="${s.title}">
    <div class="spot" style="left:${pct(x,W)};top:${pct(y,H)};width:${pct(w,W)};height:${pct(h,H)}"></div>
    ${s.tap ? `<div class="tap" style="left:${pct(x+w/2,W)};top:${pct(y+h/2,H)}"></div>` : ""}`;
  const cx = (x+w/2)/W*100, cy = (y+h/2)/H*100;
  shot.style.transformOrigin = `${cx}% ${cy}%`;
  $("screen").appendChild(shot);
  if (old) setTimeout(()=>old.remove(), 460);
  if (!reduce){
    const zoom = w*h < W*H*0.12 ? 1.18 : 1.07;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ shot.style.transform = `scale(${zoom})`; shot.querySelector(".tap")?.classList.add("go"); }));
  }
  if (fresh){ elapsed = 0; t0 = performance.now(); }
  try{ localStorage.setItem("guide_pos", JSON.stringify([ch,sc])); }catch(e){}
}
function go(dc, ds){
  ch = dc; sc = ds;
  if (location.hash !== "#"+CHAPTERS[ch].id) history.replaceState(null,"","#"+CHAPTERS[ch].id);
  render();
}
function next(){
  const c = CHAPTERS[ch];
  if (sc < c.scenes.length-1) go(ch, sc+1);
  else if (ch < CHAPTERS.length-1) go(ch+1, 0);
  else { setPlaying(false); }
}
function prev(){
  if (sc > 0) go(ch, sc-1);
  else if (ch > 0) go(ch-1, CHAPTERS[ch-1].scenes.length-1);
}
function setPlaying(p){
  playing = p;
  $("play").textContent = p ? "⏸ השהיה" : "▶ הפעלה";
  if (p){ t0 = performance.now() - elapsed; }
}
function tick(now){
  if (playing){
    elapsed = now - t0;
    const bar = $("seg-"+sc); if (bar) bar.style.width = Math.min(100, elapsed/DUR*100)+"%";
    if (elapsed >= DUR) next();
  }
  raf = requestAnimationFrame(tick);
}

$("chapters").addEventListener("click", e=>{ const b=e.target.closest("[data-ch]"); if(b){ go(+b.dataset.ch,0); setPlaying(true);} });
$("steps").addEventListener("click", e=>{ const b=e.target.closest("[data-sc]"); if(b){ go(ch,+b.dataset.sc); setPlaying(false);} });
$("next").onclick = ()=>{ next(); setPlaying(false); };
$("prev").onclick = ()=>{ prev(); setPlaying(false); };
$("play").onclick = ()=>{
  const c = CHAPTERS[ch];
  if (!playing && ch===CHAPTERS.length-1 && sc===c.scenes.length-1 && elapsed>=DUR){ go(0,0); }
  setPlaying(!playing);
};
$("screen").addEventListener("click", ()=>{ next(); });
document.addEventListener("keydown", e=>{
  if (e.target.closest("input,textarea")) return;
  if (e.key==="ArrowLeft"){ next(); setPlaying(false); }
  if (e.key==="ArrowRight"){ prev(); setPlaying(false); }
  if (e.key===" "){ e.preventDefault(); setPlaying(!playing); }
});
function fromHash(){
  const i = CHAPTERS.findIndex(c=>"#"+c.id===location.hash);
  if (i>=0 && i!==ch){ ch=i; sc=0; render(); }
}
addEventListener("hashchange", fromHash);
// preload
CHAPTERS.forEach(c=>c.scenes.forEach(s=>{ const im=new Image(); im.src=s.img+".jpg"; }));

buildChapters();
const hi = CHAPTERS.findIndex(c=>"#"+c.id===location.hash);
if (hi>=0) ch = hi;
render();
if (reduce) setPlaying(false);
raf = requestAnimationFrame(tick);
